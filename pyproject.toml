[project]
name = "ConsoleRPG"
version = "0.4.0"
description = "Modern console RPG prototype (Typer + TOML)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "rich>=14.3.3",
  "typer>=0.20.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[project.scripts]
consolerpg = "src.cli:APP"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
