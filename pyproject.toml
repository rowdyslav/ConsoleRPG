[project]
name = "ConsoleRPG"
version = "0.3.0"
description = "Config-driven console RPG prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.20.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
consolerpg = "src.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
